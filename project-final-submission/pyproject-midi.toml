[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composer_service"
version = "0.1.0"
description = "FastMCP service for training/predicting composers from MIDI, images, and poster OCR"
requires-python = ">=3.11"
dependencies = [
  "fastmcp",
  "tensorflow",
  "scikit-learn",
  "numpy",
  "pretty_midi",
  "pillow",
  "opencv-python",
  "torch",
  "torchvision",
  "transformers",
  "pytesseract",
      "numpy",
    "pretty_midi",
    "tensorflow",
    "scikit-learn",
    "fastmcp",
    "pillow",
    "matplotlib",      # For future visualization (confusion matrix, graphs)
    "pandas",   
 
]

[tool.setuptools]
# List your top-level Python modules (without the .py)
py-modules = ["main"]

